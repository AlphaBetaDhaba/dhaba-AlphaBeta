# =============================================================================
# menu-api — Python / FastAPI  (port 8001)
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-api
  namespace: dhaba
  labels:
    app: menu-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: menu-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: menu-api
        tier: backend
    spec:
      containers:
        - name: menu-api
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/dhaba/menu-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: dhaba-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: dhaba-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: dhaba-config
                  key: DB_USER
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: dhaba-secret
                  key: DB_HOST
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dhaba-secret
                  key: DB_PASSWORD
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: menu-api
  namespace: dhaba
  labels:
    app: menu-api
spec:
  selector:
    app: menu-api
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP
