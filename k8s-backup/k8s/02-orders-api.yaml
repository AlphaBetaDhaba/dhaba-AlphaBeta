# =============================================================================
# orders-api — Go  (port 8002)
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: dhaba
  labels:
    app: orders-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: orders-api
        tier: backend
    spec:
      containers:
        - name: orders-api
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/dhaba/orders-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: dhaba-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: dhaba-config
                  key: DB_USER
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: dhaba-secret
                  key: DB_HOST
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dhaba-secret
                  key: DB_PASSWORD
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: dhaba-secret
                  key: REDIS_ADDR
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: dhaba
  labels:
    app: orders-api
spec:
  selector:
    app: orders-api
  ports:
    - name: http
      protocol: TCP
      port: 8002
      targetPort: 8002
  type: ClusterIP
