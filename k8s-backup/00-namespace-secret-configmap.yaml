# =============================================================================
# Kubernetes Secret — Dhaba shared credentials
# =============================================================================
# Replace base64-encoded values with:  echo -n "your-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: dhaba-secret
  namespace: dhaba
type: Opaque
data:
  DB_HOST: cG9zdGdyZXM=          # postgres
  DB_PASSWORD: ZGhhYmE=           # dhaba
  REDIS_HOST: cmVkaXM=            # redis
  REDIS_ADDR: cmVkaXM6NjM3OQ==   # redis:6379
  APP_KEY: ""                     # base64-encoded Laravel key (php artisan key:generate)

---
# =============================================================================
# ConfigMap — Non-sensitive shared environment variables
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: dhaba-config
  namespace: dhaba
data:
  DB_NAME: dhaba
  DB_USER: dhaba
  DB_PORT: "5432"
  REDIS_PORT: "6379"
  APP_NAME: stats-api
  APP_ENV: production
  APP_DEBUG: "false"
  DB_CONNECTION: pgsql
  DB_DATABASE: dhaba
  DB_USERNAME: dhaba
