
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React application routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Menu API
    location /menu {
        proxy_pass http://menu-api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Orders API
    location /orders {
        proxy_pass http://orders-api:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
