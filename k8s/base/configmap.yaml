apiVersion: v1
kind: ConfigMap
metadata:
  name: dhaba-config
  # namespace is set by each overlay
data:
  # PostgreSQL — shared by menu-api, orders-api, kitchen-worker
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "dhaba"
  DB_USER: "dhaba"
  # PostgreSQL — stats-api uses Laravel naming conventions
  DB_CONNECTION: "pgsql"
  DB_DATABASE: "dhaba"
  DB_USERNAME: "dhaba"
  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_ADDR: "redis:6379"
  # stats-api (Laravel)
  APP_NAME: "stats-api"
  APP_ENV: "production"
  APP_DEBUG: "false"
