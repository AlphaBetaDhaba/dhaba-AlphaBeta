apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  labels:
    app: db-init
    tier: database
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."

              until pg_isready \
                -h "$DB_HOST" \
                -p "$DB_PORT" \
                -U "$DB_USER" \
                -d "$DB_NAME"; do
                sleep 5
              done

              echo "PostgreSQL is ready. Initializing schema..."

              PGPASSWORD="$DB_PASSWORD" psql \
                -v ON_ERROR_STOP=1 \
                -h "$DB_HOST" \
                -p "$DB_PORT" \
                -U "$DB_USER" \
                -d "$DB_NAME" \
                -f /sql/init.sql

              echo "Database initialization completed."
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: dhaba-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: dhaba-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: dhaba-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: dhaba-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dhaba-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: init-sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: init-sql
          configMap:
            name: dhaba-db-init-sql
