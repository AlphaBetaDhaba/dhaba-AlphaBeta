apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    app: orders-api
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: orders-api
        tier: backend
    spec:
      imagePullSecrets:
        - name: ecr-registry
      containers:
        - name: orders-api
          image: 267278679790.dkr.ecr.us-east-1.amazonaws.com/dhaba-orders-api:5e85f75c89cdc77c434d5e060f84ce1497f9d3a7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          env:
            - name: PORT
              value: "8002"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: dhaba-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: dhaba-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: dhaba-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: dhaba-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dhaba-secret
                  key: DB_PASSWORD
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: dhaba-config
                  key: REDIS_ADDR
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
