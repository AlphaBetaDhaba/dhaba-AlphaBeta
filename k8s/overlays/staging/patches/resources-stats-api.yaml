# Staging resource patch — stats-api
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-api
spec:
  template:
    spec:
      containers:
        - name: stats-api
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "250m"
              memory: "384Mi"
