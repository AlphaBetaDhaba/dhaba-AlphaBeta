# Production topology spread — stats-api
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-api
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: stats-api
