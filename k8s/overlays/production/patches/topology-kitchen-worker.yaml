# Production topology spread — kitchen-worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitchen-worker
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: kitchen-worker
