apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-secret-refresh
  namespace: ops
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 180

      template:
        spec:
          serviceAccountName: ecr-secret-refresher
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ecr-registry

          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet

          containers:
            - name: refresh
              image: 267278679790.dkr.ecr.us-east-1.amazonaws.com/ops-monitor:ecr-secret-refresh
              imagePullPolicy: IfNotPresent

              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  AWS_REGION="us-east-1"
                  REGISTRY="267278679790.dkr.ecr.us-east-1.amazonaws.com"

                  echo "Checking AWS identity..."

                  aws sts get-caller-identity

                  for NAMESPACE in dhaba-staging dhaba-production; do
                    echo "Refreshing ECR credentials in $NAMESPACE..."

                    ECR_TOKEN=$(aws ecr get-login-password \
                      --region "$AWS_REGION")

                    kubectl create secret docker-registry ecr-registry \
                      --namespace "$NAMESPACE" \
                      --docker-server="$REGISTRY" \
                      --docker-username=AWS \
                      --docker-password="$ECR_TOKEN" \
                      --dry-run=client -o yaml |
                      kubectl apply -f -

                    unset ECR_TOKEN

                    echo "Successfully refreshed $NAMESPACE"
                  done

                  echo "ECR credential refresh completed."