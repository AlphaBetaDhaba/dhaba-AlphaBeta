apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-secret-refresher
  namespace: ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-refresher
  namespace: dhaba-staging
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ecr-registry"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-secret-refresher
  namespace: dhaba-staging
subjects:
  - kind: ServiceAccount
    name: ecr-secret-refresher
    namespace: ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-secret-refresher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-refresher
  namespace: dhaba-production
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ecr-registry"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-secret-refresher
  namespace: dhaba-production
subjects:
  - kind: ServiceAccount
    name: ecr-secret-refresher
    namespace: ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-secret-refresher