name: Dhaba Orders CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # React: Build + Vitest
  web:
    name: Web - Build and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

  # Python: pytest
  menu-api:
    name: Menu API - Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: menu-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: menu-api
        run: pytest

  # Go: Tests
  orders-api:
    name: Orders API - Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: orders-api/go.mod
          cache: true
          cache-dependency-path: orders-api/go.sum

      - name: Run tests
        working-directory: orders-api
        run: go test ./...

  # Java: Maven verification
  kitchen-worker:
    name: Kitchen Worker - Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: kitchen-worker/pom.xml

      - name: Run Maven verification
        working-directory: kitchen-worker
        run: mvn -B verify

  # PHP: PHPUnit
  stats-api:
    name: Stats API - Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Prepare Laravel directories
        working-directory: stats-api
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs

      - name: Install dependencies
        working-directory: stats-api
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        working-directory: stats-api
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: composer test

  # Kubernetes manifests: Validation
  kubernetes:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Kustomize
        run: |
          curl -sSLo /tmp/kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install /tmp/kustomize /usr/local/bin/kustomize

      - name: Validate staging manifests
        run: |
          mkdir -p rendered
          kustomize build k8s/overlays/staging > rendered/staging.yaml
          docker run --rm -v "$PWD/rendered:/work" \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary /work/staging.yaml

      - name: Validate production manifests
        run: |
          mkdir -p rendered
          kustomize build k8s/overlays/production > rendered/production.yaml
          docker run --rm -v "$PWD/rendered:/work" \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary /work/production.yaml