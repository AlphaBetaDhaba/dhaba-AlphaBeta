
name: Build and Push Images to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    outputs:
      web: ${{ steps.filter.outputs.web }}
      menu-api: ${{ steps.filter.outputs.menu-api }}
      orders-api: ${{ steps.filter.outputs.orders-api }}
      kitchen-worker: ${{ steps.filter.outputs.kitchen-worker }}
      stats-api: ${{ steps.filter.outputs.stats-api }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
            menu-api:
              - 'menu-api/**'
            orders-api:
              - 'orders-api/**'
            kitchen-worker:
              - 'kitchen-worker/**'
            stats-api:
              - 'stats-api/**'

  prepare:
    name: Prepare build matrix
    needs: changes
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.value }}

    steps:
      - id: matrix
        env:
          WEB: ${{ needs.changes.outputs.web }}
          MENU: ${{ needs.changes.outputs.menu-api }}
          ORDERS: ${{ needs.changes.outputs.orders-api }}
          KITCHEN: ${{ needs.changes.outputs.kitchen-worker }}
          STATS: ${{ needs.changes.outputs.stats-api }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          MATRIX='[]'

          add_service() {
            MATRIX=$(jq -c \
              --arg service "$1" \
              --arg context "$2" \
              --arg dockerfile "$3" \
              --arg repository "$4" \
              '. + [{"service":$service,"context":$context,"dockerfile":$dockerfile,"repository":$repository}]' \
              <<< "$MATRIX")
          }

          if [[ "$FORCE_ALL" == "true" || "$WEB" == "true" ]]; then
            add_service web ./web ./web/Dockerfile dhaba-web
          fi

          if [[ "$FORCE_ALL" == "true" || "$MENU" == "true" ]]; then
            add_service menu-api ./menu-api ./menu-api/Dockerfile dhaba-menu-api
          fi

          if [[ "$FORCE_ALL" == "true" || "$ORDERS" == "true" ]]; then
            add_service orders-api ./orders-api ./orders-api/Dockerfile dhaba-orders-api
          fi

          if [[ "$FORCE_ALL" == "true" || "$KITCHEN" == "true" ]]; then
            add_service kitchen-worker ./kitchen-worker ./kitchen-worker/Dockerfile dhaba-kitchen-worker
          fi

          if [[ "$FORCE_ALL" == "true" || "$STATS" == "true" ]]; then
            add_service stats-api ./stats-api ./stats-api/Dockerfile dhaba-stats-api
          fi

          echo "value=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Selected services: $MATRIX"

  build-and-push:
    name: Build and push ${{ matrix.service }}
    needs: prepare
    if: needs.prepare.outputs.matrix != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate AWS configuration
        shell: bash
        run: |
          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "AWS_ROLE_ARN GitHub variable is missing."
            exit 1
          fi

          if [[ -z "$AWS_REGION" ]]; then
            echo "AWS_REGION GitHub variable is missing."
            exit 1
          fi

          if [[ -z "$AWS_ACCOUNT_ID" ]]; then
            echo "AWS_ACCOUNT_ID GitHub variable is missing."
            exit 1
          fi

          echo "AWS configuration variables are present."

      - name: Check GitHub OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('OIDC audience:', payload.aud);
            console.log('OIDC subject:', payload.sub);
            console.log('OIDC repository:', payload.repository);
            console.log('OIDC ref:', payload.ref);    

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS account
        shell: bash
        run: |
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "Authenticated AWS account: $ACTUAL_ACCOUNT"

          if [[ "$ACTUAL_ACCOUNT" != "$AWS_ACCOUNT_ID" ]]; then
            echo "Authenticated to the wrong AWS account."
            exit 1
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance : false

      # - name: Wait for ECR vulnerability scan
      #   shell: bash
      #   env:
      #     REPOSITORY: ${{ matrix.repository }}
      #     IMAGE_TAG: ${{ github.sha }}
      #   run: |
      #     STATUS=""

      #     for attempt in {1..20}; do
      #       STATUS=$(aws ecr describe-image-scan-findings \
      #         --repository-name "$REPOSITORY" \
      #         --image-id imageTag="$IMAGE_TAG" \
      #         --query 'imageScanStatus.status' \
      #         --output text 2>/dev/null || true)

      #       echo "Scan status: $STATUS"

      #       if [[ "$STATUS" == "COMPLETE" ]]; then
      #         break
      #       fi

      #       if [[ "$STATUS" == "FAILED" ]]; then
      #         echo "ECR vulnerability scan failed."
      #         exit 1
      #       fi

      #       sleep 15
      #     done

      #     if [[ "$STATUS" != "COMPLETE" ]]; then
      #       echo "ECR scan did not complete in time."
      #       exit 1
      #     fi

      
      - name: Debug ECR vulnerability scan
        shell: bash
        env:
          REPOSITORY: ${{ matrix.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Repository: $REPOSITORY"
          echo "Image tag: $IMAGE_TAG"

          aws ecr describe-image-scan-findings \
            --repository-name "$REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --region us-east-1 \
            --output json


      - name: Fail if critical vulnerabilities exist
        shell: bash
        env:
          REPOSITORY: ${{ matrix.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SCAN_JSON=$(aws ecr describe-image-scan-findings \
            --repository-name "$REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --output json)
          
          CRITICAL=$(python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          counts = data.get("imageScanFindings", {}).get("findingSeverityCounts", {})
          print(counts.get("CRITICAL", 0))
          ' <<< "$SCAN_JSON")
          
          echo "Critical vulnerabilities: $CRITICAL"
          
          if (( CRITICAL > 0 )); then
            echo "Critical vulnerabilities found. Failing pipeline."
            exit 1
          fi
