name: Dhaba Orders CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-push-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate GitHub Actions with AWS using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push all application services
      - name: Build and Push Images
        run: |
          SERVICES="menu-api orders-api kitchen-worker stats-api web"

          for SERVICE in $SERVICES; do
            IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/dhaba/${SERVICE}"

            docker build \
              -t "${IMAGE}:${GITHUB_SHA}" \
              "./${SERVICE}"

            docker push "${IMAGE}:${GITHUB_SHA}"
          done

      # Scan images before deployment
      - name: Scan Images with Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/dhaba/menu-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

      # Connect to EC2 and deploy
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/dhaba-AlphaBeta

            git pull origin main

            kubectl apply -f k8s/

            kubectl rollout restart deployment -n staging

            kubectl rollout status deployment -n staging --timeout=180s