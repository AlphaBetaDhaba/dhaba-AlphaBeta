
name: Deploy Dhaba Staging

on:
  workflow_run:
    workflows: ["Build and Push Images to ECR"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      AWS_ACCOUNT_ID: "267278679790"
      AWS_REGION: us-east-1

    steps:
      # Checkout the exact commit that triggered the build.
      - name: Checkout deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Package Kubernetes manifests.
      - name: Package Kubernetes manifests
        run: |
          tar -czf "k8s-${IMAGE_TAG}.tar.gz" k8s

      # Transfer manifests to EC2.
      - name: Upload manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: dhaba-deploy
          key: ${{ secrets.DHABA_DEPLOY_SSH_KEY }}
          source: k8s-${{ github.event.workflow_run.head_sha }}.tar.gz
          target: /tmp/

      # Deploy to Minikube on EC2.
      - name: Deploy to EC2 staging
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          AWS_ACCOUNT_ID: "267278679790"
          AWS_REGION: us-east-1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: dhaba-deploy
          key: ${{ secrets.DHABA_DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,AWS_ACCOUNT_ID,AWS_REGION
          command_timeout: 30m

          script: |
            bash -s <<'DEPLOY'
            set -euo pipefail

            NAMESPACE="dhaba-staging"
            REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

            DEPLOYMENTS=(
              web
              menu-api
              orders-api
              kitchen-worker
              stats-api
            )

            declare -A REPOSITORIES=(
              [web]=dhaba-web
              [menu-api]=dhaba-menu-api
              [orders-api]=dhaba-orders-api
              [kitchen-worker]=dhaba-kitchen-worker
              [stats-api]=dhaba-stats-api
            )

            declare -A CURRENT_IMAGES=()
            declare -A PREVIOUS_TEMPLATES=()
            declare -A PREVIOUS_REVISIONS=()

            WORK_DIR=""
            PORT_FORWARD_PID=""
            ECR_JOB=""
            CHANGES_STARTED=false
            DEPLOY_SUCCEEDED=false

            fail() {
              echo "::error::Staging deployment failed: $1"
              exit 1
            }

            template_hash() {
              {
                kubectl get deployment "$1" -n "$NAMESPACE" \
                  -o jsonpath='{.spec.template}' 2>/dev/null || true
              } | sha256sum | cut -d' ' -f1
            }

            rollback() {
              echo "Rolling back Deployments changed by this run..."

              for deployment in "${DEPLOYMENTS[@]}"; do
                before_revision="${PREVIOUS_REVISIONS[$deployment]:-}"

                if [[ "$(template_hash "$deployment")" == \
                      "${PREVIOUS_TEMPLATES[$deployment]}" ]]; then
                  continue
                fi

                if [[ -z "$before_revision" ]]; then
                  echo "::warning::$deployment was created by this run; no previous revision exists."
                  continue
                fi

                echo "Rolling back $deployment to revision $before_revision"

                kubectl rollout undo deployment/"$deployment" \
                  -n "$NAMESPACE" \
                  --to-revision="$before_revision" ||
                  echo "::warning::Rollback of $deployment failed."

                kubectl rollout status deployment/"$deployment" \
                  -n "$NAMESPACE" --timeout=180s ||
                  echo "::warning::$deployment did not become ready after rollback."
              done
            }

            on_exit() {
              local status=$?
              set +e

              if [[ -n "$PORT_FORWARD_PID" ]]; then
                kill "$PORT_FORWARD_PID" 2>/dev/null
              fi

              if [[ -n "$ECR_JOB" ]]; then
                kubectl delete job "$ECR_JOB" -n ops \
                  --wait=false 2>/dev/null
              fi

              if [[ "$CHANGES_STARTED" == true && \
                    "$DEPLOY_SUCCEEDED" != true ]]; then
                rollback
              fi

              if [[ -n "$WORK_DIR" ]]; then
                rm -rf "$WORK_DIR"
              fi

              rm -f "/tmp/k8s-${IMAGE_TAG}.tar.gz"

              exit "$status"
            }

            trap on_exit EXIT

            # Validate the commit SHA.
            [[ "$IMAGE_TAG" =~ ^[a-f0-9]{40}$ ]] ||
              fail "Invalid image tag: $IMAGE_TAG"

            # Extract manifests transferred by GitHub Actions.
            WORK_DIR=$(mktemp -d /tmp/dhaba-deploy-staging-XXXXXX)

            ARCHIVE="/tmp/k8s-${IMAGE_TAG}.tar.gz"

            [[ -f "$ARCHIVE" ]] ||
              fail "Kubernetes manifest archive was not transferred."

            tar -xzf "$ARCHIVE" -C "$WORK_DIR" ||
              fail "Could not extract Kubernetes manifests."

            [[ -d "$WORK_DIR/k8s/overlays/staging" ]] ||
              fail "Staging Kustomize overlay is missing."

            # Verify Kubernetes access.
            kubectl get deployments -n "$NAMESPACE" >/dev/null ||
              fail "Cannot access namespace $NAMESPACE."

            # Verify application secrets.
            for key in APP_KEY DB_PASSWORD; do
              value=$(kubectl get secret dhaba-secret \
                -n "$NAMESPACE" \
                -o jsonpath="{.data.$key}" 2>/dev/null || true)

              [[ -n "$value" ]] ||
                fail "Secret dhaba-secret is missing or has no $key."
            done

            # Refresh ECR credentials using the CronJob.
            echo "Starting ECR credential refresh..."

            ECR_JOB="ecr-refresh-$(date +%s)"

            kubectl create job "$ECR_JOB" \
              --from=cronjob/ecr-secret-refresh \
              -n ops ||
              fail "Could not start ECR refresh job."

            if ! kubectl wait \
              --for=condition=complete \
              "job/$ECR_JOB" \
              -n ops \
              --timeout=180s; then

              kubectl logs "job/$ECR_JOB" -n ops --tail=100 || true
              fail "ECR credential refresh failed."
            fi

            echo "ECR credentials refreshed successfully."

            # Capture existing Deployment state for rollback.
            for deployment in "${DEPLOYMENTS[@]}"; do

              CURRENT_IMAGES[$deployment]=$(kubectl get deployment \
                "$deployment" -n "$NAMESPACE" \
                -o jsonpath='{.spec.template.spec.containers[0].image}' \
                2>/dev/null || true)

              PREVIOUS_TEMPLATES[$deployment]=$(template_hash "$deployment")

              PREVIOUS_REVISIONS[$deployment]=$(kubectl get deployment \
                "$deployment" -n "$NAMESPACE" \
                -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}' \
                2>/dev/null || true)

            done

            # Select the newest images available for this commit.
            IMAGE_ENTRIES=""

            for deployment in "${DEPLOYMENTS[@]}"; do

              repository="${REPOSITORIES[$deployment]}"
              manifest_name="$REGISTRY/$repository"

              if ecr_output=$(aws ecr describe-images \
                --repository-name "$repository" \
                --image-ids imageTag="$IMAGE_TAG" \
                --region "$AWS_REGION" 2>&1); then

                image="$manifest_name:$IMAGE_TAG"
                echo "$deployment: deploying $image"

              elif ! grep -q ImageNotFoundException <<< "$ecr_output"; then

                fail "ECR lookup for $repository failed: $ecr_output"

              elif [[ -n "${CURRENT_IMAGES[$deployment]}" ]]; then

                image="${CURRENT_IMAGES[$deployment]}"
                echo "$deployment: keeping existing image $image"

              else

                echo "$deployment: first deployment; using manifest image"
                continue

              fi

              IMAGE_ENTRIES+="  - name: $manifest_name"$'\n'
              IMAGE_ENTRIES+="    newName: ${image%:*}"$'\n'
              IMAGE_ENTRIES+="    newTag: ${image##*:}"$'\n'

            done

            # Create temporary Kustomize wrapper.
            mkdir "$WORK_DIR/deploy"

            {
              echo "apiVersion: kustomize.config.k8s.io/v1beta1"
              echo "kind: Kustomization"
              echo "resources:"
              echo "  - ../k8s/overlays/staging"

              if [[ -n "$IMAGE_ENTRIES" ]]; then
                echo "images:"
                printf '%s' "$IMAGE_ENTRIES"
              fi

            } > "$WORK_DIR/deploy/kustomization.yaml"

            # Render manifests.
            kubectl kustomize "$WORK_DIR/deploy" \
              --load-restrictor=LoadRestrictionsNone \
              > "$WORK_DIR/rendered.yaml" ||
              fail "Could not render staging manifests."

            # Apply manifests.
            echo "Applying staging manifests..."

            CHANGES_STARTED=true

            kubectl apply -f "$WORK_DIR/rendered.yaml" ||
              fail "kubectl apply failed."

            # Wait for application Deployments.
            for deployment in "${DEPLOYMENTS[@]}"; do

              echo "Waiting for $deployment..."

              kubectl rollout status deployment/"$deployment" \
                -n "$NAMESPACE" \
                --timeout=180s ||
                fail "$deployment rollout failed."

            done

            # Wait for PostgreSQL and Redis.
            for statefulset in postgres redis; do

              echo "Waiting for $statefulset..."

              kubectl rollout status statefulset/"$statefulset" \
                -n "$NAMESPACE" \
                --timeout=180s ||
                fail "$statefulset rollout failed."

            done

            # Start web Service port-forward.
            kubectl port-forward \
              -n "$NAMESPACE" \
              svc/web :80 \
              > "$WORK_DIR/port-forward.log" 2>&1 &

            PORT_FORWARD_PID=$!

            SMOKE_PORT=""

            for _ in $(seq 1 30); do

              SMOKE_PORT=$(sed -nE \
                's/.*Forwarding from 127\.0\.0\.1:([0-9]+) -> 80.*/\1/p' \
                "$WORK_DIR/port-forward.log" | head -n 1)

              if [[ -n "$SMOKE_PORT" ]]; then
                break
              fi

              if ! kill -0 "$PORT_FORWARD_PID" 2>/dev/null; then
                fail "Port-forward exited: $(cat "$WORK_DIR/port-forward.log")"
              fi

              sleep 1

            done

            [[ -n "$SMOKE_PORT" ]] ||
              fail "Port-forward did not become ready."

            echo "Web smoke test using port $SMOKE_PORT"

            # Basic smoke test.
            curl --fail --silent --show-error \
              --max-time 10 \
              --retry 3 \
              --retry-delay 2 \
              "http://127.0.0.1:$SMOKE_PORT/" ||
              fail "Web smoke test failed."

            echo "Staging smoke test passed."

            # Load test: 100 requests, 10 concurrent.
            echo "Starting staging load test..."

            seq 1 100 | xargs -P 10 -I '{}' \
              curl --fail --silent --show-error \
                --output /dev/null \
                --max-time 10 \
                "http://127.0.0.1:$SMOKE_PORT/" ||
              fail "Staging load test failed."

            echo "Staging load test passed."

            # Record exact images running in staging.
            RELEASE_NAME="release-$IMAGE_TAG"

            declare -A DEPLOYED_IMAGES=()

            for deployment in "${DEPLOYMENTS[@]}"; do

              repository="${REPOSITORIES[$deployment]}"
              prefix="$REGISTRY/$repository:"

              image=$(kubectl get deployment "$deployment" \
                -n "$NAMESPACE" \
                -o jsonpath='{.spec.template.spec.containers[0].image}') ||
                fail "Cannot read image for $deployment."

              tag="${image#"$prefix"}"

              if [[ "$image" != "$prefix"* ]] ||
                ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then

                fail "$deployment runs an invalid image reference: $image"

              fi

              DEPLOYED_IMAGES[$deployment]="$image"

            done

            # Create immutable release record.
            if kubectl get configmap "$RELEASE_NAME" \
              -n "$NAMESPACE" >/dev/null 2>&1; then

              for deployment in "${DEPLOYMENTS[@]}"; do

                recorded=$(kubectl get configmap "$RELEASE_NAME" \
                  -n "$NAMESPACE" \
                  -o go-template="{{with index .data \"$deployment\"}}{{.}}{{end}}")

                [[ "$recorded" == "${DEPLOYED_IMAGES[$deployment]}" ]] ||
                  fail "Existing release record does not match $deployment."

              done

              echo "Existing release record matches."

            else

              {
                echo "apiVersion: v1"
                echo "kind: ConfigMap"
                echo "metadata:"
                echo "  name: $RELEASE_NAME"
                echo "  namespace: $NAMESPACE"
                echo "  labels:"
                echo '    dhaba.io/release-record: "true"'
                echo "  annotations:"
                echo "    dhaba.io/commit: \"$IMAGE_TAG\""
                echo "    dhaba.io/recorded-at: \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
                echo "immutable: true"
                echo "data:"

                for deployment in "${DEPLOYMENTS[@]}"; do
                  echo "  $deployment: \"${DEPLOYED_IMAGES[$deployment]}\""
                done

              } > "$WORK_DIR/release.yaml"

              kubectl create -f "$WORK_DIR/release.yaml" ||
                fail "Could not create release record."

              echo "Created release record $RELEASE_NAME"

            fi

            DEPLOY_SUCCEEDED=true

            echo "=========================================="
            echo "Dhaba staging deployment completed!"
            echo "Commit: $IMAGE_TAG"
            echo "Namespace: $NAMESPACE"
            echo "=========================================="

            DEPLOY
